<!DOCTYPE html>
<html>
<head>
<title>Image Gallery</title>
<style>
body { font-family: Arial; text-align: center; }

.gallery img {
    width: 200px;
    margin: 10px;
    cursor: pointer;
    transition: 0.3s;
}

.gallery img:hover {
    transform: scale(1.1);
}

#popup {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
}

#popup img {
    margin-top: 100px;
    width: 400px;
}
</style>
</head>

<body>

<h2>Image Gallery</h2>

<div class="gallery">
    <img src="https://picsum.photos/200?1" onclick="openImage(this.src)">
    <img src="https://picsum.photos/200?2" onclick="openImage(this.src)">
    <img src="https://picsum.photos/200?3" onclick="openImage(this.src)">
</div>

<div id="popup" onclick="closeImage()">
    <img id="popupImg">
</div>

<script>
function openImage(src) {
    document.getElementById("popup").style.display = "block";
    document.getElementById("popupImg").src = src;
}

function closeImage() {
    document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
